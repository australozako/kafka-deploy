services:

  kafka-controller:
    image: confluentinc/cp-kafka:7.9.6
    container_name: kafka-controller
    hostname: kafka-controller
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - "/mnt/c/Users/sirib/kafka-deploy/single-node/certs:/etc/kafka/secrets:ro"
      - controller_data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: "MEu7iq-2QwSDZAt89_Dmow"
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "101@kafka-controller:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:SSL,SSL_INTERNAL:SSL"
      KAFKA_INTER_BROKER_LISTENER_NAME: "SSL_INTERNAL"

      # SSL Global explicite (requis par RequestSendThread / ControllerChannelManager)
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.controller.keystore.jks"
      KAFKA_SSL_KEYSTORE_PASSWORD: "changeit"
      KAFKA_SSL_KEY_PASSWORD: "changeit"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.controller.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_PASSWORD: "changeit"
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_SSL_KEYSTORE_FILENAME: "kafka.controller.keystore.jks"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "keystore_creds"
      KAFKA_SSL_KEY_CREDENTIALS: "key_creds"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "kafka.controller.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "truststore_creds"
      KAFKA_SSL_CLIENT_AUTH: "required"
      # --- AUTHORIZER & ACLs mTLS ---
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:.*CN=([^,]*).*$/$1/,DEFAULT"
      KAFKA_SUPER_USERS: "User:kafka.client;User:Kafka-Internal-CA;User:localhost;User:kafka-admin;User:kafka-controller;User:kafka;User:kafka-1;User:kafka-2;User:kafka-3;User:kafka-controller-1;User:kafka-controller-2;User:kafka-controller-3;User:client"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"


      # SSL Listener CONTROLLER
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.controller.keystore.jks"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEY_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.controller.truststore.jks"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_TRUSTSTORE_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_CLIENT_AUTH: "required"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

      # SSL Connexion sortante vers le broker via SSL_INTERNAL
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.controller.keystore.jks"
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_KEYSTORE_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_KEY_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.controller.truststore.jks"
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_TRUSTSTORE_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_CLIENT_AUTH: "required"


  kafka:
    image: confluentinc/cp-kafka:7.9.6
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - "/mnt/c/Users/sirib/kafka-deploy/single-node/certs:/etc/kafka/secrets:ro"
      - broker_data:/var/lib/kafka/data
    environment:
      # Double listener : 9092 pour l'extérieur (localhost), 29092 pour Docker (kafka)
      KAFKA_LISTENERS: "SSL://:9092,SSL_INTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "SSL://localhost:9092,SSL_INTERNAL://kafka:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "SSL_INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Configuration SSL Broker
      KAFKA_SSL_KEYSTORE_FILENAME: "kafka.broker.keystore.jks"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "keystore_creds"
      KAFKA_SSL_KEY_CREDENTIALS: "key_creds"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "kafka.broker.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "truststore_creds"
      KAFKA_SSL_CLIENT_AUTH: "required"
      # --- AUTHORIZER & ACLs mTLS ---
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:.*CN=([^,]*).*$/$1/,DEFAULT"
      KAFKA_SUPER_USERS: "User:kafka.client;User:Kafka-Internal-CA;User:localhost;User:kafka-admin;User:kafka-controller;User:kafka;User:kafka-1;User:kafka-2;User:kafka-3;User:kafka-controller-1;User:kafka-controller-2;User:kafka-controller-3;User:client"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"

      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_LISTENER_NAME_SSL_INTERNAL_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

      # PHASE 3 : Mode KRaft pur (ZooKeeper supprimé)
      CLUSTER_ID: "MEu7iq-2QwSDZAt89_Dmow"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "101@kafka-controller:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "SSL:SSL,SSL_INTERNAL:SSL,CONTROLLER:SSL"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.broker.keystore.jks"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEY_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.broker.truststore.jks"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_TRUSTSTORE_PASSWORD: "changeit"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    volumes:
      - "/mnt/c/Users/sirib/kafka-deploy/single-node/certs:/etc/kafka/secrets:ro"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local-migration-cluster"
      # Kafbat UI utilise désormais le listener interne Docker (29092)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "SSL"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/kafka.client.truststore.jks"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: "changeit"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/kafka.client.keystore.jks"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD: "changeit"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD: "changeit"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

volumes:
  controller_data:
  broker_data:
