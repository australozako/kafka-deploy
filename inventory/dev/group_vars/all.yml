kafka_image: "docker.io/confluentinc/cp-kafka:7.9.0"
cluster_id: "DEV-4L62215-QC20p4m13R8O9g"

# IP de la passerelle Docker WSL2 (docker0) pour joindre ZooKeeper sur l'hôte
zk_connect: "172.17.0.1:2181"

# Mapping exact des ports hôtes des 3 contrôleurs KRaft (9093, 9094, 9095)
controller_quorum_voters: "1@172.17.0.1:9093,2@172.17.0.1:9094,3@172.17.0.1:9095"

# Développement local en PLAINTEXT
kafka_security_protocol: "PLAINTEXT"
kafka_ssl_enabled: false


# Changer cette variable à chaque étape : phase0 | phase1 | phase2 | phase3
migration_phase: "phase0"

# Récupéré automatiquement par Ansible dès la phase 1 (ou à renseigner en dur après récupération)
kafka_cluster_id: ""

# Réseau & SSL
kafka_advertised_host: "localhost"
certs_dir: "{{ playbook_dir }}/certs"

# Identifiants SSL (fichiers présents dans certs_dir)
broker_keystore: "kafka.broker.keystore.jks"
broker_truststore: "kafka.broker.truststore.jks"
controller_keystore: "kafka.controller.keystore.jks"
controller_truststore: "kafka.controller.truststore.jks"