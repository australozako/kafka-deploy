---
- name: Créer le répertoire de données spécifique au Broker
  ansible.builtin.file:
    path: "/var/lib/kafka/broker-{{ broker_id }}/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0777'
    recurse: yes

- name: Calculer le port du Broker
  ansible.builtin.set_fact:
    broker_port: "{{ 9092 if (broker_id | int) == 101 else (9085 + (broker_id | int - 100)) }}"

- name: Définir les variables d'environnement du Broker (Phase Dual)
  ansible.builtin.set_fact:
    broker_env_base:
      KAFKA_BROKER_ID: "{{ broker_id | string }}"
      KAFKA_ZOOKEEPER_CONNECT: "{{ zk_connect }}"
      KAFKA_ZOOKEEPER_METADATA_MIGRATION_ENABLE: "true"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "{{ controller_quorum_voters }}"
     # Listeners
      KAFKA_LISTENERS: "CLIENT://0.0.0.0:9092"
      # IP passerelle Docker pour la communication inter-conteneurs
      KAFKA_ADVERTISED_LISTENERS: "CLIENT://172.17.0.1:{{ broker_port }}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CLIENT:{{ kafka_security_protocol }},CONTROLLER:{{ kafka_security_protocol }}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "CLIENT"

- name: Injecter la configuration SSL (si activée)
  ansible.builtin.set_fact:
    broker_env_ssl: >-
      {{
        {
          'KAFKA_SSL_KEYSTORE_LOCATION': ssl_cert_dir ~ '/kafka.broker.keystore.jks',
          'KAFKA_SSL_KEYSTORE_PASSWORD': ssl_keystore_password,
          'KAFKA_SSL_KEY_PASSWORD': ssl_keystore_password,
          'KAFKA_SSL_TRUSTSTORE_LOCATION': ssl_cert_dir ~ '/kafka.truststore.jks',
          'KAFKA_SSL_TRUSTSTORE_PASSWORD': ssl_truststore_password,
          'KAFKA_SSL_CLIENT_AUTH': 'required'
        } if kafka_ssl_enabled else {}
      }}

- name: Déployer/Mettre à jour le conteneur Kafka Broker (Docker - Phase Dual)
  community.docker.docker_container:
    name: "kafka-broker-{{ broker_id }}"
    image: "{{ kafka_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: yes
    published_ports:
      - "{{ broker_port }}:9092"
    volumes: >-
      {{
        [
          '/var/lib/kafka/broker-' ~ broker_id ~ '/data:/var/lib/kafka/data'
        ] + (
          ['/var/lib/kafka/secrets:' ~ ssl_cert_dir ~ ':ro'] if kafka_ssl_enabled else []
        )
      }}
    env: "{{ broker_env_base | combine(broker_env_ssl | default({})) }}"

############################# HEALTHCHECKS #############################

- name: "Healthcheck 1 : Attente d'ouverture du port TCP local"
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ broker_port }}"
    state: started
    delay: 5
    timeout: 60

- name: "Healthcheck 2 : Validation de la réactivité des APIs Kafka via Docker"
  ansible.builtin.command: >
    docker exec kafka-broker-{{ broker_id }} kafka-broker-api-versions
    --bootstrap-server localhost:9092
  register: api_check
  until: api_check.rc == 0
  retries: 10
  delay: 6
  changed_when: false